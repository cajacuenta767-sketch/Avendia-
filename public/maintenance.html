<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma en Mantenimiento | AVEND ESCALA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    body {
      min-height: 100vh;
      background: #090d16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(15, 23, 42, 1) 0px, transparent 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    /* Resplandor ambiental decorativo */
    .glow-orb {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }
    /* Tarjeta Principal de Cristal (Glassmorphism) */
    .card {
      position: relative;
      z-index: 2;
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 36px;
      padding: 52px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 
        0 30px 70px -15px rgba(0, 0, 0, 0.8),
        0 0 50px rgba(37, 99, 235, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    /* Badge Superior */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 18px;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #93c5fd;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 28px;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.15);
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      background: #3b82f6;
      border-radius: 50%;
      box-shadow: 0 0 10px #60a5fa;
      animation: pulseDot 2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    /* Ícono Central con Halo */
    .icon-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-halo {
      position: absolute;
      inset: -4px;
      background: linear-gradient(135deg, #2563eb, #7c3aed, #06b6d4);
      border-radius: 28px;
      opacity: 0.7;
      filter: blur(12px);
      animation: rotateHalo 6s linear infinite;
    }
    .icon-box {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.1);
    }
    /* Títulos y Textos */
    h1 {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.25;
      color: #ffffff;
      margin-bottom: 14px;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.65;
      font-weight: 500;
      margin-bottom: 32px;
      padding: 0 8px;
    }
    p strong {
      color: #f1f5f9;
      font-weight: 700;
    }
    /* Barra de Carga Elegante */
    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 30px;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #2563eb, #60a5fa, #818cf8);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(96, 165, 250, 0.6);
      animation: streamFlow 2.2s infinite ease-in-out;
    }
    @keyframes streamFlow {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
    /* Botón de Acción */
    .btn-refresh {
      width: 100%;
      padding: 16px 28px;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 
        0 10px 25px -5px rgba(37, 99, 235, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .btn-refresh:hover {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      transform: translateY(-2px);
      box-shadow: 
        0 15px 30px -5px rgba(37, 99, 235, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .btn-refresh:active {
      transform: translateY(0);
    }
    .btn-icon {
      font-size: 16px;
      transition: transform 0.4s ease;
    }
    .btn-refresh:hover .btn-icon {
      transform: rotate(180deg);
    }
    /* Nota de Seguridad */
    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 22px;
      font-size: 11.5px;
      font-weight: 600;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="glow-orb"></div>
  <div class="card">
    <div class="badge">
      <span class="badge-dot"></span>
      AVEND ESCALA — PLATAFORMA OFICIAL
    </div>
    <div class="icon-wrapper">
      <div class="icon-halo"></div>
      <div class="icon-box">🚀</div>
    </div>
    <h1>Nos encontramos en mantenimiento</h1>
    <p>Estamos implementando nuevas evaluaciones y optimizaciones pedagógicas. La plataforma volverá a estar disponible en <strong>breve</strong>.</p>
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
    <button class="btn-refresh" id="refreshBtn" onclick="comprobarServidor()">
      <span class="btn-icon">🔄</span>
      <span>Comprobar si ya está disponible</span>
    </button>
    <div class="security-badge">
      <span>🔒</span> Tus datos y avances están totalmente seguros.
    </div>
  </div>
  <script>
    async function comprobarServidor() {
      const btn = document.getElementById('refreshBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="btn-icon">⏳</span><span>Verificando conexión...</span>';
      btn.style.opacity = '0.85';
      btn.style.pointerEvents = 'none';
      try {
        const res = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
        if (res.status === 200 || res.status === 304) {
          btn.innerHTML = '<span>✅</span><span>¡Servidor listo! Cargando...</span>';
          setTimeout(() => { window.location.reload(); }, 400);
          return;
        }
      } catch (e) {}
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
      }, 700);
    }
  </script>
</body>
</html>
