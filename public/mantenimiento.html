<!DOCTYPE html>
<html lang=es>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0>
  <title>Plataforma en Mantenimiento | Avend Escala</title>
  <link rel=preconnect href=https://fonts.googleapis.com>
  <link rel=preconnect href=https://fonts.gstatic.com crossorigin>
  <link href=https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap rel=stylesheet>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .card {
      position: relative;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 48px 36px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.15);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4);
    }
    .icon-wrapper svg { width: 42px; height: 42px; color: #ffffff; animation: spin 10s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h1 { font-size: 26px; font-weight: 800; color: #ffffff; line-height: 1.25; margin-bottom: 12px; }
    p.description { font-size: 15px; line-height: 1.6; color: #94a3b8; margin-bottom: 28px; }
    .timer-container {
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 20px 16px;
      margin-bottom: 28px;
    }
    .timer-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 12px; }
    .timer-display { display: flex; justify-content: center; align-items: center; gap: 16px; }
    .time-unit { display: flex; flex-direction: column; align-items: center; min-width: 65px; }
    .time-value { font-size: 32px; font-weight: 800; color: #38bdf8; line-height: 1; }
    .time-sub { font-size: 11px; color: #64748b; margin-top: 4px; font-weight: 500; }
    .time-separator { font-size: 24px; font-weight: 700; color: #475569; margin-top: -10px; }
    .progress-bar-wrapper { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 9999px; overflow: hidden; margin-top: 16px; }
    .progress-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #4f46e5, #06b6d4); border-radius: 9999px; transition: width 1s linear; }
    .btn-refresh {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #4f46e5;
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
      transition: all 0.2s ease;
      width: 100%;
    }
    .btn-refresh:hover { background: #4338ca; transform: translateY(-2px); }
    .footer { margin-top: 24px; font-size: 12px; color: #64748b; }
    .footer strong { color: #94a3b8; }
  </style>
</head>
<body>
  <div class=card>
    <div class=badge><span class=badge-dot></span> Actualización en Progreso</div>
    <div class=icon-wrapper>
      <svg fill=none viewBox=0 0 24 24 stroke=currentColor stroke-width=2>
        <path stroke-linecap=round stroke-linejoin=round d=M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15 />
      </svg>
    </div>
    <h1>Estamos actualizando la plataforma</h1>
    <p class=description>Estamos desplegando nuevas mejoras en el sistema. Volvemos en 10 minutos.</p>
    <div class=timer-container>
      <div class=timer-label>Tiempo estimado de espera</div>
      <div class=timer-display>
        <div class=time-unit><span class=time-value id=min>10</span><span class=time-sub>MINUTOS</span></div>
        <span class=time-separator>:</span>
        <div class=time-unit><span class=time-value id=sec>00</span><span class=time-sub>SEGUNDOS</span></div>
      </div>
      <div class=progress-bar-wrapper>
        <div class=progress-bar-fill id=progress></div>
      </div>
    </div>
    <button class=btn-refresh onclick=window.location.reload()>Comprobar estado ahora</button>
    <div class=footer><strong>Avend Escala</strong> &bull; Banco de Evaluaciones y Recursos MINEDU</div>
  </div>
  <script>
    const TOTAL_SECONDS = 10 * 60;
    let remaining = TOTAL_SECONDS;
    const minEl = document.getElementById('min');
    const secEl = document.getElementById('sec');
    const progressEl = document.getElementById('progress');
    setInterval(() => {
      if (remaining > 0) remaining--;
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      minEl.textContent = m < 10 ? '0' + m : m;
      secEl.textContent = s < 10 ? '0' + s : s;
      progressEl.style.width = ((remaining / TOTAL_SECONDS) * 100) + '%';
      if (remaining === 0) window.location.reload();
    }, 1000);
    setInterval(() => {
      fetch(window.location.href, { method: 'HEAD', cache: 'no-store' })
        .then(res => { if (res.status === 200) window.location.reload(); })
        .catch(() => {});
    }, 15000);
  </script>
</body>
</html>
