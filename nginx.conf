server {
    server_name cuadernillos.avend.pe;
    root /var/www/html;
    client_max_body_size 100M;

    # Interceptar 502, 503 y 504 con la pantalla interactiva
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/html;
        internal;
    }

    location / {
        # 1. Interruptor manual en 1-clic: Si existe maintenance.enable, retornar 503
        if (-f /var/www/html/maintenance.enable) {
            return 503;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cuadernillos.avend.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cuadernillos.avend.pe/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = cuadernillos.avend.pe) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name cuadernillos.avend.pe;
    return 404;
}
