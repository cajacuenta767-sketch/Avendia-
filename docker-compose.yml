version: '3.8'

services:
  cuadernillos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuadernillos-app
    restart: always
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./storage_uploads:/app/public/uploads

